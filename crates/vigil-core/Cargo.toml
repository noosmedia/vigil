# Kernbibliothek: Datentypen, Pfade, Konfiguration, clamd-Client, Scanner, Quarantäne, Systemcheck
[package]
name = "vigil-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sha2 = "0.11.0"
walkdir = "2.5.0"
ed25519-dalek = { version = "3.0.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

# Windows-Schicht: Dateizugriff ohne Verknüpfungen, Rechte, Prozesse, bekannte Ordner
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
] }
